<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Passaggi Danza">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Passaggi Danza</title>
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fff;
      color: #6b7280;
      font-size: 15px;
      z-index: 2;
      transition: opacity .2s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">Caricamento Passaggi Danza…</div>
  <iframe
    id="app"
    title="Passaggi Danza"
    src="https://script.google.com/macros/s/AKfycbxPl4hvcWbLosaf8LDL55cevHZVREZsyu21ek3ejGfirjOjFx2WkyaOF1KMBqAqDVrFqA/exec"
    allow="fullscreen"
  ></iframe>
  <script>
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    frame.addEventListener('load', () => loading.classList.add('hidden'));
  </script>
</body>
</html>
